services:
  # Static Site - SPA Frontend
  - type: web
    name: saintvision-app
    env: static
    plan: free
    region: oregon
    branch: main
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: ./dist/spa
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PUBLIC_BUILDER_KEY
        value: 2c553a9d8cf24e6eae81a4a63962c5a4
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://nivrmhkdgtmmbtswyvey.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdnJtaGtkZ3RtbWJ0c3d5dmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1MTA1MjEsImV4cCI6MjA2MjA4NjUyMX0.Y0lx7FA97zV3GkKAmu_5aV8Bz98AYyqvHdHEau6Tvfc
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index
      - path: /*
        name: Cache-Control
        value: max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: max-age=31536000

