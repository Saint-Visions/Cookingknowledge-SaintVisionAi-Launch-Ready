services:
  # Static Site - SPA Frontend
  - type: web
    name: saintvision-app
    env: static
    plan: free
    region: oregon
    branch: main
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: ./dist/spa
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PUBLIC_BUILDER_KEY
        value: 2c553a9d8cf24e6eae81a4a63962c5a4
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index
      - path: /*
        name: Cache-Control
        value: max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: max-age=31536000

# Optional: If you need a database
# databases:
#   - name: saintvision-db
#     databaseName: saintvision
#     user: saintvision_user
#     plan: free
#     region: oregon
