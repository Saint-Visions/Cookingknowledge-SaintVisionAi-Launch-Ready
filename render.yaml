services:
  # Web Service - SPA Frontend
  - type: web
    name: saintvision-app
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/spa
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_ENV
        value: production
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index

  # API Service (Optional - if you have backend APIs)
  - type: web
    name: saintvision-api
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Add your environment variables from .env here
    # - key: DATABASE_URL
    #   fromDatabase:
    #     name: saintvision-db
    #     property: connectionString
    # - key: OPENAI_API_KEY
    #   sync: false  # This will be a secret env var you set manually
    # - key: AZURE_OPENAI_API_KEY
    #   sync: false

# Optional: If you need a database
# databases:
#   - name: saintvision-db
#     databaseName: saintvision
#     user: saintvision_user
#     plan: free
#     region: oregon
