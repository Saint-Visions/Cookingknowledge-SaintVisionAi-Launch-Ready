services:
  # Static Site - SPA Frontend
  - type: web
    name: saintvision-app
    env: static
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/spa
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index
      - path: /*
        name: Cache-Control
        value: max-age=3600

# Optional: If you need a database
# databases:
#   - name: saintvision-db
#     databaseName: saintvision
#     user: saintvision_user
#     plan: free
#     region: oregon
